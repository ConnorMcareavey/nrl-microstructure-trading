[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrl-microstructure-trading"
version = "0.1.0"
description = "Checks whether a bookmaker's live next-try odds were too long on the team that had just scored."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# The importable code lives in src/nrl_microstructure/.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the tests import nrl_microstructure without installing the package first.
pythonpath = ["src"]
